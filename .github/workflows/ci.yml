name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-and-deploy:
    name: Server and RouterOS scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run server tests
        run: node --test server/test/config.test.js server/test/service.test.js
      - name: Run RouterOS generator tests
        run: node --test deploy/generate-routeros.test.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find server/src deploy -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

  native-prep:
    name: Prepare pinned strongSwan engine
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install native build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes autoconf automake libtool make perl jq gperf
          sdkmanager 'ndk;27.3.13750724'
      - name: Prepare verified native source and OpenSSL libraries
        shell: bash
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.3.13750724"
          bash scripts/prepare-strongswan.sh
      - name: Package prepared engine
        shell: bash
        run: |
          mkdir -p dist-native
          tar --exclude='native/vendor/strongswan/.git' -czf dist-native/strongswan-prepared.tar.gz native/vendor/strongswan
      - uses: actions/upload-artifact@v7
        with:
          name: mikrolink-strongswan-prepared-${{ github.sha }}
          path: dist-native/strongswan-prepared.tar.gz
          if-no-files-found: error
          retention-days: 1

  android:
    name: Android ${{ matrix.arch }}
    needs: native-prep
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64-v8a
            abi: arm64-v8a
          - arch: armeabi-v7a
            abi: armeabi-v7a
          - arch: x86_64
            abi: x86_64
          - arch: universal
            abi: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: mikrolink-strongswan-prepared-${{ github.sha }}
          path: .native-artifact
      - name: Restore prepared strongSwan engine
        shell: bash
        run: tar -xzf .native-artifact/strongswan-prepared.tar.gz -C .
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK components
        shell: bash
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.3.13750724'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.10.2
      - name: Build architecture APK
        shell: bash
        env:
          ABI: ${{ matrix.abi }}
          ARCH: ${{ matrix.arch }}
          VERSION: 0.1.0-ci.${{ github.run_number }}
        run: |
          set -euo pipefail
          args=(--no-daemon -p android assembleDebug "-PmikrolinkVersion=${VERSION}")
          if [[ -n "$ABI" ]]; then args+=("-PtargetAbi=${ABI}"); fi
          gradle "${args[@]}"
          mkdir -p dist
          output="dist/MikroLink-${VERSION}-android-${ARCH}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$output"
          filename="$(basename "$output")"
          (cd dist && sha256sum "$filename" > "${filename}.sha256")
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: MikroLink-0.1.0-ci.${{ github.run_number }}-android-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

